[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-price-prediction"
version = "1.0.0"
description = "End-to-end ML pipeline for used car price prediction"
readme = "README.md"
authors = [{name = "3rd Year Data Science Student", email = "student@university.edu"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scipy==1.13.0",
    "scikit-learn==1.4.1",
    "xgboost==2.1.1",
    "lightgbm==4.3.0",
    "catboost==1.2.5",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "plotly==5.19.0",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    "tqdm==4.66.4",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "black==24.2.0",
    "ruff==0.3.0",
    "pre-commit==3.6.0",
    "jupyter==1.0.0",
    "jupyterlab==4.2.2",
    "ipykernel==6.29.4",
    "shap==0.44.1",
    "optuna==4.0.0",
]
notebook = [
    "jupyter==1.0.0",
    "jupyterlab==4.2.2",
    "ipykernel==6.29.4",
]
explain = [
    "shap==0.44.1",
]
optuna = [
    "optuna==4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/car-price-prediction"
Repository = "https://github.com/yourusername/car-price-prediction"
Issues = "https://github.com/yourusername/car-price-prediction/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | build
  | dist
  | models
  | data
  | reports
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default args
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "models",
    "data",
    "reports",
    "__pycache__",
    "notebooks",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true