# Car Price Prediction - Configuration
# Modify paths and hyperparameters here without touching code

# Data paths
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_filename: "car_prices.csv"
  train_filename: "train.parquet"
  test_filename: "test.parquet"
  target_column: "selling_price"
  id_column: "name"

# Preprocessing
preprocessing:
  test_size: 0.2
  random_state: 42
  missing_threshold: 0.5  # Drop columns with >50% missing
  outlier_method: "iqr"   # "iqr" or "zscore"
  outlier_threshold: 1.5

# Feature engineering
features:
  categorical_columns:
    - "fuel"
    - "seller_type"
    - "transmission"
    - "owner"
    - "brand"
  numerical_columns:
    - "year"
    - "km_driven"
    - "mileage"
    - "engine"
    - "max_power"
    - "seats"
  target_encode_columns:
    - "brand"
  drop_columns:
    - "name"
    - "torque"
  # Feature engineering flags
  create_age_feature: true
  create_km_per_year: true
  create_power_to_weight: false  # Need weight data

# Model training
model:
  # Models to train
  models:
    - "linear_regression"
    - "ridge"
    - "random_forest"
    - "xgboost"
    - "lightgbm"
    - "catboost"

  # Cross-validation
  cv_folds: 5
  cv_scoring: "neg_root_mean_squared_error"

  # Hyperparameter search
  use_optuna: true
  optuna_trials: 50
  optuna_timeout: 1800  # seconds

  # Model-specific params (defaults, overridden by Optuna)
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

  lightgbm:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.1
    num_leaves: 31

  catboost:
    iterations: 500
    depth: 6
    learning_rate: 0.1

# Evaluation
evaluation:
  metrics:
    - "rmse"
    - "mae"
    - "r2"
    - "mape"
  residual_analysis: true
  feature_importance: true
  permutation_importance: true
  shap_analysis: true

# Output
output:
  model_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  save_predictions: true
  save_model: true
  best_model_name: "best_model.joblib"